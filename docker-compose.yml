services:
  db:
    image: postgres:16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-off loader; only runs via `docker compose run --rm loader`.
  loader:
    build:
      context: .
      dockerfile: Dockerfile.loader
    profiles: ["tools"]
    env_file: .env
    environment:
      PGHOST: db
    volumes:
      - ./data:/app/data:ro
      - ./db:/app/db:ro
      - ./load_data.py:/app/load_data.py:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
